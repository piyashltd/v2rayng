name: Sync Config to Base64

on:
  push:
    paths:
      - 'servers/**/*.yml' # servers ফোল্ডার বা এর ভেতরের যেকোনো দেশের ফোল্ডারে .yml ফাইলে পরিবর্তন হলে রান করবে
  workflow_dispatch: # চাইলে ম্যানুয়ালি রান করার জন্য

jobs:
  update-config:
    runs-on: ubuntu-latest
    permissions:
      contents: write # ফাইলে পরিবর্তন সেভ করার পারমিশন

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Generate index.txt
        run: |
          cat << 'EOF' > generate.py
          import os, yaml, json, base64, urllib.parse

          # Base64 Encode function
          def b64(s): return base64.b64encode(s.encode('utf-8')).decode('utf-8')

          uris = []

          # servers ফোল্ডার এবং এর ভেতরের সব ফোল্ডার/ফাইল স্ক্যান করা
          for root, dirs, files in os.walk('servers'):
              for file in files:
                  if file.endswith('.yml') or file.endswith('.yaml'):
                      filepath = os.path.join(root, file)
                      with open(filepath, 'r', encoding='utf-8') as f:
                          try:
                              data = yaml.safe_load(f)
                              if not data: continue
                              
                              # যদি কনফিগ Clash ফরম্যাটে (proxies: ...) থাকে অথবা সরাসরি লিস্ট আকারে থাকে
                              proxies = data.get('proxies', []) if isinstance(data, dict) else data
                              if not isinstance(proxies, list): continue

                              for p in proxies:
                                  # যদি সরাসরি vmess:// বা vless:// লিংক দেয়া থাকে
                                  if isinstance(p, str):
                                      if p.startswith(('vmess://', 'vless://', 'trojan://', 'ss://')):
                                          uris.append(p)
                                      continue
                                  
                                  # যদি Clash এর মত সাজানো ডেটা থাকে
                                  if not isinstance(p, dict): continue

                                  ptype = p.get('type')
                                  raw_name = p.get('name', 'Proxy')
                                  name = urllib.parse.quote(raw_name)
                                  server = p.get('server', '')
                                  port = p.get('port', '')
                                  
                                  if ptype == 'vmess':
                                      v_obj = {
                                          "v": "2", "ps": raw_name, "add": server, "port": str(port),
                                          "id": p.get('uuid', ''), "aid": str(p.get('alterId', 0)),
                                          "scy": p.get('cipher', 'auto'), "net": p.get('network', 'tcp'),
                                          "type": "none", "tls": "tls" if p.get('tls') else ""
                                      }
                                      if p.get('sni'): v_obj['sni'] = p.get('sni')
                                      if p.get('network') == 'ws':
                                          opts = p.get('ws-opts', {})
                                          v_obj['path'] = opts.get('path', '/')
                                          if 'headers' in opts and 'Host' in opts['headers']:
                                              v_obj['host'] = opts['headers']['Host']
                                      uris.append("vmess://" + b64(json.dumps(v_obj, separators=(',', ':'))))
                                      
                                  elif ptype == 'vless':
                                      uuid = p.get('uuid', '')
                                      params = {"type": p.get('network', 'tcp'), "encryption": "none"}
                                      if p.get('tls'): params["security"] = "tls"
                                      if p.get('sni'): params["sni"] = p.get('sni')
                                      if p.get('network') == 'ws':
                                          opts = p.get('ws-opts', {})
                                          params['path'] = urllib.parse.quote(opts.get('path', '/'), safe='')
                                          if 'headers' in opts and 'Host' in opts['headers']:
                                              params['host'] = urllib.parse.quote(opts['headers']['Host'])
                                      query = "&".join([f"{k}={v}" for k, v in params.items()])
                                      uris.append(f"vless://{uuid}@{server}:{port}?{query}#{name}")
                                      
                                  elif ptype == 'trojan':
                                      password = p.get('password', '')
                                      params = {"type": p.get('network', 'tcp')}
                                      if p.get('tls') or p.get('network') == 'tcp': params["security"] = "tls"
                                      if p.get('sni'): params["sni"] = p.get('sni')
                                      query = "&".join([f"{k}={v}" for k, v in params.items()])
                                      uris.append(f"trojan://{password}@{server}:{port}?{query}#{name}")
                          except Exception as e:
                              print(f"Error parsing {filepath}: {e}")

          # সব প্রক্সি লিংক Base64 তে ইনকোড করে index.txt ফাইলে সেভ করা
          if uris:
              b64_sub = b64("\n".join(uris))
              with open('index.txt', 'w', encoding='utf-8') as f:
                  f.write(b64_sub)
              print(f"Successfully generated index.txt with {len(uris)} proxies.")
          else:
              # যদি কোনো প্রক্সি না পায়, তাহলে খালি index.txt তৈরি করবে
              with open('index.txt', 'w', encoding='utf-8') as f:
                  f.write("")
              print("No proxies found!")
          EOF
          python generate.py

      - name: Commit and Push index.txt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.txt
          git commit -m "Auto-sync index.txt from servers folder via workflow" || echo "No changes to commit"
          git push
